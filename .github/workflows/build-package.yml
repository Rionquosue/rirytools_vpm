# Builds the RiryTools VPM package from the source repository's main branch when it
# differs from the latest release, publishes it as a release of this repository with
# the next version, then starts build-listing.yml. Nothing reaches VCC users until the
# owner approves the listing's Pages deployment (see build-listing.yml).
#
# All version information comes from this repository: the latest release, and the
# "version" in the package.json template here, which raises the version to publish
# (minor and major bumps). The source repository's package.json is not used.
#
# It polls hourly instead of being dispatched, so no personal access token exists.
# Only the current commit of the source repository's main branch is ever built.
name: Build Package

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-package
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Rionquosue/riryunityworkflow

jobs:
  check:
    # Runs only in the main repository, never in forks such as rirytools_vpm_dev.
    if: github.repository == 'Rionquosue/rirytools_vpm'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      # Full history of both, to rebuild the latest release from the commits named in its notes.
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      # A "version" in the package.json template above the latest release is published as is.
      # Otherwise the latest release must be one this workflow made and must rebuild from the
      # commits in its notes, or the run fails so the owner can look at it. Source main is then
      # built with the latest release's version: a different zip means main has new content.
      - name: Compare source main with the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git -C source rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | python3 -I scripts/build_vpm.py latest)
          if [ -z "$latest" ]; then
            version=$(python3 -I scripts/build_vpm.py next)
          else
            version=$(python3 -I scripts/build_vpm.py next --latest "$latest" --changed false)
          fi
          if [ -n "$latest" ] && [ -z "$version" ]; then
            python3 -I scripts/verify_listing.py --release "v$latest" --source source
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$latest")
            GITHUB_OUTPUT=/dev/null python3 -I scripts/build_vpm.py build --source source --version "$latest" --repository "$GITHUB_REPOSITORY" --dist dist
            if echo "$release" | python3 -I scripts/verify_release.py --zip dist/*.zip > /dev/null; then changed=false; else changed=true; fi
            version=$(python3 -I scripts/build_vpm.py next --latest "$latest" --changed "$changed")
          fi
          if [ -z "$version" ]; then
            echo "Source main is unchanged since v$latest. If its listing never deployed, run Build Repo Listing by hand."
            exit 0
          fi
          echo "Publishing $version (latest release: ${latest:-none})."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.check.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      - name: Require a commit on the source main branch
        run: |
          git -C source fetch --quiet origin main
          git -C source merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::$(git -C source rev-parse HEAD) is not on $SOURCE_REPOSITORY main."; exit 1; }

      - name: Build the package
        id: build
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python3 -I scripts/build_vpm.py build --source source --version "$VERSION" --repository "$GITHUB_REPOSITORY"

      # Never reuse or overwrite a release or tag that appeared since the check.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
          TITLE: ${{ steps.build.outputs.name }} ${{ steps.build.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG appeared since the check. Not touching it; review it by hand."; exit 1
          fi
          gh release create "$TAG" "$ZIP" dist/package.json --target main --title "$TITLE" \
            --notes "Built from $SOURCE_REPOSITORY@$(git -C source rev-parse HEAD) with $GITHUB_REPOSITORY@$GITHUB_SHA."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | python3 -I scripts/verify_release.py --zip "$ZIP"

      # Releases made with the workflow token do not start other workflows, so start the listing build here.
      - name: Rebuild the listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-listing.yml --ref main
