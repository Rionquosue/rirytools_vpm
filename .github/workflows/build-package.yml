# Builds the RiryTools VPM package when the source repository's main branch has a
# version that is not released yet, publishes it as a release of this repository,
# then starts build-listing.yml. Nothing reaches VCC users until the owner approves
# the listing's Pages deployment (see build-listing.yml).
#
# It polls hourly instead of being dispatched, so no personal access token exists.
# Only the current commit of the source repository's main branch is ever built.
name: Build Package

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-package
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Rionquosue/riryunityworkflow

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: main
          path: source
          persist-credentials: false
          lfs: true

      # A release this workflow did not make, or whose zip does not match, is never
      # reused or overwritten: the run fails so the owner can look at it.
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/build_vpm.py version --source source)
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! release=$(gh api "repos/${{ github.repository }}/releases/tags/v$version" 2>/dev/null); then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GITHUB_OUTPUT=/dev/null python3 scripts/build_vpm.py build --source source --repository "${{ github.repository }}" --dist dist
          echo "$release" | python3 scripts/verify_release.py --zip dist/*.zip
          echo "Version $version is already released. Bump \"version\" in package.json to publish a new one."

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.check.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      - name: Require a commit on the source main branch
        run: |
          git -C source fetch --quiet origin main
          git -C source merge-base --is-ancestor HEAD FETCH_HEAD || {
            echo "::error::$(git -C source rev-parse HEAD) is not on ${{ env.SOURCE_REPOSITORY }} main."; exit 1; }

      - name: Build the package
        id: build
        run: python3 scripts/build_vpm.py build --source source --repository "${{ github.repository }}"

      # Never reuse or overwrite a release or tag that appeared since the check.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
          TITLE: ${{ steps.build.outputs.name }} ${{ steps.build.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG appeared since the check. Not touching it; review it by hand."; exit 1
          fi
          gh release create "$TAG" "$ZIP" dist/package.json --target main --title "$TITLE" \
            --notes "Built from $SOURCE_REPOSITORY@$(git -C source rev-parse HEAD)."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | python3 scripts/verify_release.py --zip "$ZIP"

      # Releases made with the workflow token do not start other workflows, so start the listing build here.
      - name: Rebuild the listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-listing.yml --ref main
