# Builds the VPM listing (index.json and the landing page) from this repository's
# releases with VRChat's package-list-action, checks the built artifact in a
# separate job with scripts/verify_listing.py, and deploys it to GitHub Pages
# without waiting: the owner's approval is the merge to the source's main.
#
# The deploy job uses the github-pages environment, which Pages deployments need.
# Give it a main-only deployment branch rule and no required reviewers.
name: Build Repo Listing

on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - source.json
      - Website/**

permissions:
  contents: read

env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  build-listing:
    # Runs only in the main repository, never in forks such as rirytools_vpm_dev.
    if: github.repository == 'Rionquosue/rirytools_vpm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned to a reviewed commit of the automation repository.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out
          persist-credentials: false

      - name: Restore Cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The two steps of actions/upload-pages-artifact, which calls upload-artifact by a movable tag,
      # with upload-artifact pinned instead.
      - name: Archive the site
        run: tar --directory "$listPublishDirectory" -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 7
          if-no-files-found: error

  # A separate job with fresh checkouts checks the exact artifact that will be deployed,
  # so nothing the listing build downloaded or ran can change the check.
  verify-listing:
    needs: build-listing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the listing
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Verify the listing
        run: python3 -I scripts/verify_listing.py --artifact "$RUNNER_TEMP/pages/artifact.tar"

  # Deployments queue in order; the newest waiting deployment replaces an older one.
  deploy:
    needs: verify-listing
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
