# Checks issues and their comments for prompt injection (links, override phrases,
# hidden or styled characters, HTML and more) and for the required sections of
# the feature request and bug report forms. See scripts/issue_check.py.
#
# Issue text is read from the event file by the script and never placed in this
# workflow's expressions or shell commands.
name: Issue Check

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-check-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  issue-check:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIPWIRE_HASHES: ${{ vars.TRIPWIRE_HASHES }}
        # Fail closed until the tripwire hashes are configured: no issue is marked passed.
        run: |
          test -n "$TRIPWIRE_HASHES" || { echo "::error::Set the TRIPWIRE_HASHES Actions variable."; exit 1; }
          python3 -I scripts/issue_check.py
