# Checks the deployed listing every day: each listed zip must still be the one the
# build made, unchanged, and reproducible from a commit on the source main branch.
# A failed run here means a published zip changed. Do not approve any deployment
# until it is explained.
name: Audit Listing

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Rionquosue/riryunityworkflow
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
          lfs: true

      - name: Audit the deployed listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/verify_listing.py --audit --source source
